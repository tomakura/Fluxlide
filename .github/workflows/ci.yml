# Fluxlide CI: checks that the app builds on every target OS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check / ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            ffmpeg_target: x86_64-pc-windows-msvc
          - name: Linux x64
            platform: ubuntu-22.04
            ffmpeg_target: x86_64-unknown-linux-gnu
          - name: macOS
            platform: macos-latest
            ffmpeg_target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libasound2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the bundled FFmpeg for media tests
        uses: ./.github/actions/build-ffmpeg
        with:
          target: ${{ matrix.ffmpeg_target }}

      - name: Require the bundled media tools
        shell: bash
        env:
          FFMPEG_TARGET: ${{ matrix.ffmpeg_target }}
        run: |
          tool_dir="$RUNNER_TEMP/fluxlide-test-tools"
          mkdir -p "$tool_dir"
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then
            suffix=.exe
            tool_dir="$(cygpath -m "$tool_dir")"
          fi
          cp "src-tauri/binaries/fluxlide-ffmpeg-$FFMPEG_TARGET$suffix" "$tool_dir/ffmpeg$suffix"
          cp "src-tauri/binaries/fluxlide-ffprobe-$FFMPEG_TARGET$suffix" "$tool_dir/ffprobe$suffix"
          "$tool_dir/ffmpeg$suffix" -version
          "$tool_dir/ffprobe$suffix" -version
          echo "FLUXLIDE_FFMPEG_DIR=$tool_dir" >> "$GITHUB_ENV"

      - name: Check frontend
        run: npm run check

      - name: Test frontend
        run: npm test

      - name: Check release version consistency
        run: node scripts/check-release.mjs

      - name: Audit frontend dependencies
        if: runner.os == 'Linux'
        run: npm audit --audit-level=moderate

      # tauri::generate_context! requires the built frontend to exist.
      - name: Build frontend
        run: npm run build

      - name: Check formatting
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo fmt -p fluxlide -p fluxlide-engine -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The GPU test skips itself on runners without a usable adapter.
      - name: Test
        run: cargo test --workspace --locked

      - name: Test the GLib safety backport with optimization
        if: runner.os == 'Linux'
        run: cargo test -p fluxlide --test glib_variant --release --locked

      - name: Audit Rust dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked
          node scripts/check-glib-patch.mjs
          cargo audit --deny unsound

      # The tests also write the TypeScript types (docs/ipc.md); they must
      # match the ones committed.
      - name: Check generated TypeScript types
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          git add -N src/lib/bindings
          git diff --exit-code -- src/lib/bindings
