# Fluxlide release pipeline
# This workflow intentionally runs only after a version tag (vX.Y.Z) is pushed.
# The workflow has not yet been tested with a real tag.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build / ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            ffmpeg_target: x86_64-pc-windows-msvc
            args: ''
          - name: Linux x64
            platform: ubuntu-22.04
            ffmpeg_target: x86_64-unknown-linux-gnu
            args: ''
          - name: macOS Apple Silicon
            platform: macos-latest
            ffmpeg_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - name: macOS Intel
            platform: macos-latest
            ffmpeg_target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libasound2-dev

      - name: Install frontend dependencies
        run: npm ci

      # The bundled FFmpeg is not needed by `tauri dev` or `cargo build`, so
      # it is added to the bundle here through an extra config file.
      - name: Build FFmpeg
        uses: ./.github/actions/build-ffmpeg
        with:
          target: ${{ matrix.ffmpeg_target }}

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Fluxlide ${{ github.ref_name }}'
          releaseBody: 'Cross-platform Fluxlide release. See the attached platform installers.'
          # A draft until the FFmpeg source offer and the license notices in the
          # app are settled (docs/spike-ffmpeg-bundling.md, 5.4).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.bundle.conf.json
