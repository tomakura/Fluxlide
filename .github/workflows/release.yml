# Fluxlide release pipeline. Builds the installers for every OS and puts
# them on a draft GitHub release, which is published by hand after the
# builds have been checked (docs/release.md).
#
# Runs when a version tag (vX.Y.Z) is pushed, or by hand ("Run workflow")
# with the version to build. Signing is used only when its secrets are set:
# without them the installers are unsigned.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 1.0.0). It must match the app version.'
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Check every version and lockfile
        id: version
        run: echo "version=$(node scripts/check-release.mjs "$TAG")" >> "$GITHUB_OUTPUT"
      - name: Require verified main and prepare one draft
        id: release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.data.commit.sha !== context.sha) throw new Error('Release must build the current main commit');
            const runs = await github.request('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs', {
              owner, repo, workflow_id: 'ci.yml', head_sha: context.sha, event: 'push', per_page: 100
            });
            if (runs.data.workflow_runs[0]?.conclusion !== 'success') throw new Error('CI for this exact main commit has not succeeded');
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const matching = releases.filter(r => r.tag_name === process.env.TAG);
            if (matching.length > 1) throw new Error('Duplicate releases exist for this tag');
            const existing = matching[0];
            if (existing && (!existing.draft || existing.target_commitish !== context.sha)) throw new Error('This version already exists for a different or published build');
            const body = require('fs').readFileSync(`docs/releases/${process.env.VERSION}.md`, 'utf8');
            const release = existing ?? (await github.rest.repos.createRelease({
              owner, repo, tag_name: process.env.TAG, target_commitish: context.sha,
              name: `Fluxlide ${process.env.TAG}`, body, draft: true, prerelease: false
            })).data;
            core.setOutput('id', String(release.id));
      - name: Archive matching sources and build instructions
        run: node scripts/release-sources.mjs
      - name: Attach sources to the same release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" target/release-sources/* --clobber

  publish:
    needs: prepare
    name: Build / ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            ffmpeg_target: x86_64-pc-windows-msvc
            args: ''
          - name: Linux x64
            platform: ubuntu-22.04
            ffmpeg_target: x86_64-unknown-linux-gnu
            args: ''
          - name: macOS Apple Silicon
            platform: macos-latest
            ffmpeg_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - name: macOS Intel
            platform: macos-latest
            ffmpeg_target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'

    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
      # Whether the signing secrets are there (secrets cannot be read in `if`).
      SIGN_MACOS: ${{ secrets.APPLE_CERTIFICATE != '' }}
      SIGN_WINDOWS: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the version
        shell: bash
        run: |
          node scripts/check-release.mjs "$TAG"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macOS') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libasound2-dev xvfb

      - name: Install frontend dependencies
        run: npm ci

      # The bundled FFmpeg is not needed by `tauri dev` or `cargo build`, so
      # it is added to the bundle here through an extra config file.
      - name: Build FFmpeg
        uses: ./.github/actions/build-ffmpeg
        with:
          target: ${{ matrix.ffmpeg_target }}

      - name: Write the license notices
        run: npm run licenses

      # Windows: the certificate (a .pfx, base64) is imported and named to
      # the bundler by its thumbprint in one more config file.
      - name: Import the Windows signing certificate
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 4 | Set-Content src-tauri/tauri.windows-sign.conf.json
          "SIGN_ARGS=--config src-tauri/tauri.windows-sign.conf.json" >> $env:GITHUB_ENV

      # macOS: the bundler signs and notarizes when these are set; it tries
      # even when they are empty, so the step without them is separate.
      - name: Build and publish (macOS, signed)
        if: runner.os == 'macOS' && env.SIGN_MACOS == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }} --config src-tauri/tauri.bundle.conf.json

      - name: Build and publish
        if: runner.os != 'macOS' || env.SIGN_MACOS != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }} --config src-tauri/tauri.bundle.conf.json ${{ env.SIGN_ARGS }}

      - name: Check the installed Linux app and sidecars
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo dpkg -i target/release/bundle/deb/*.deb
          /usr/bin/fluxlide-ffmpeg -version
          /usr/bin/fluxlide-ffprobe -version
          set +e
          timeout 10s xvfb-run -a /usr/bin/fluxlide > target/linux-installed-startup.log 2>&1
          result=$?
          set -e
          cat target/linux-installed-startup.log
          if [ "$result" != 124 ]; then echo 'Installed application exited before the startup smoke check completed'; exit 1; fi

      - name: Check macOS bundle contents
        if: runner.os == 'macOS'
        shell: bash
        env:
          FFMPEG_TARGET: ${{ matrix.ffmpeg_target }}
        run: |
          app="target/$FFMPEG_TARGET/release/bundle/macos/Fluxlide.app"
          test -x "$app/Contents/MacOS/fluxlide"
          test -x "$app/Contents/MacOS/fluxlide-ffmpeg"
          test -f "$app/Contents/Resources/licenses/THIRD_PARTY_NOTICES.txt"
          if [ "$FFMPEG_TARGET" = aarch64-apple-darwin ]; then
            "$app/Contents/MacOS/fluxlide-ffmpeg" -version
            "$app/Contents/MacOS/fluxlide-ffprobe" -version
          fi

      - name: Check the extracted Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $extract = Join-Path $env:RUNNER_TEMP 'fluxlide-msi'
          $install = Start-Process msiexec.exe -ArgumentList @('/a', $installer.FullName, '/qn', "TARGETDIR=$extract") -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "MSI extraction failed: $($install.ExitCode)" }
          $app = Get-ChildItem -LiteralPath $extract -Recurse -Filter fluxlide.exe | Select-Object -First 1
          if (!$app) { throw 'App executable is missing from the MSI' }
          & (Join-Path $app.DirectoryName 'fluxlide-ffmpeg.exe') -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled FFmpeg did not start' }
          & (Join-Path $app.DirectoryName 'fluxlide-ffprobe.exe') -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled ffprobe did not start' }
          if (!(Test-Path (Join-Path $app.DirectoryName 'licenses/THIRD_PARTY_NOTICES.txt'))) { throw 'License notices are missing' }

  verify:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Download and verify all release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --dir target/release-verify
          node scripts/verify-release.mjs
          gh release upload "$TAG" target/release-verify/SHA256SUMS target/release-verify/release-provenance.json --clobber
