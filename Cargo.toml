[workspace]
resolver = "3"
members = ["src-tauri", "crates/fluxlide-engine"]
exclude = ["vendor/glib"]

[patch.crates-io]
# Tauri 2 uses GTK3/glib 0.18. Backport gtk-rs/gtk-rs-core#1343.
glib = { path = "vendor/glib" }

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/tomakura/Fluxlide"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Photo decoding and resizing are tens of times slower without optimization,
# too slow to preload the next photo in time during `tauri dev`.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
